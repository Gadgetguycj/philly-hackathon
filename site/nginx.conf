server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/html text/css application/javascript;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Without this the browser's automatic request would be answered with the
    # whole page by the fallback below.
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location = / {
        add_header Cache-Control "public, max-age=300";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
