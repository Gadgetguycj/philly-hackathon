name: Publish demo images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: roast
            context: demos/roast
          - name: stickerwall
            context: demos/stickerwall
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags
        id: tags
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "value=ghcr.io/galaxygate/philly-hackathon-${{ matrix.name }}:latest,ghcr.io/galaxygate/philly-hackathon-${{ matrix.name }}:${short_sha}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.tags.outputs.value }}

